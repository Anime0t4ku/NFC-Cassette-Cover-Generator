name: NFC-Cassette-Cover-Generator

on: [push, pull_request]

permissions:
  contents: write

jobs:

  # =====================================================
  # Windows Build
  # =====================================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: nfc-cassette-cover-generator
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests pyinstaller

      - name: Build Windows executable
        shell: cmd
        working-directory: nfc-cassette-cover-generator
        run: pyinstaller --clean --onefile --windowed --icon app.ico --add-data "icon.png;." --add-data "assets;assets" --name NFC-Cassette-Cover-Generator nfc-cassette-cover-generator.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: NFC-Cassette-Cover-Generator-Windows-x86_64
          path: nfc-cassette-cover-generator/dist/NFC-Cassette-Cover-Generator.exe


  # =====================================================
  # Linux Build
  # =====================================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Required for Tkinter / ImageTk (Pillow previews)
      - name: Install Tkinter
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        working-directory: nfc-cassette-cover-generator
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests pyinstaller

      - name: Build Linux executable
        working-directory: nfc-cassette-cover-generator
        run: pyinstaller --clean --onefile --windowed --add-data "icon.png:." --add-data "assets:assets" --name NFC-Cassette-Cover-Generator nfc-cassette-cover-generator.py

      - name: Make binary executable
        run: chmod +x nfc-cassette-cover-generator/dist/NFC-Cassette-Cover-Generator

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: NFC-Cassette-Cover-Generator-Linux-x86_64
          path: nfc-cassette-cover-generator/dist/NFC-Cassette-Cover-Generator


  # =====================================================
  # Release
  # =====================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Zip Windows build
        run: |
          cd dist
          zip ../NFC-Cassette-Cover-Generator-Windows-x86_64.zip NFC-Cassette-Cover-Generator.exe

      - name: Tar Linux build
        run: |
          cd dist
          tar -czvf ../NFC-Cassette-Cover-Generator-Linux-x86_64.tar.gz NFC-Cassette-Cover-Generator

      - name: Update Git Tag
        run: |
          git tag -f Pre-release
          git push -f origin Pre-release

      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          tag: Pre-release
          artifacts: |
            NFC-Cassette-Cover-Generator-Windows-x86_64.zip
            NFC-Cassette-Cover-Generator-Linux-x86_64.tar.gz

